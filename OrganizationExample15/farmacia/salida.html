<head>

<title>Requisición</title>

<body>
<table width="100%" cellpadding="0" cellspacing="0">
<tr>
<td align="center">
<table style="border: 1px #AAA solid;border-radius: 5px;">
<tr>
<td align="left">
<table>
        <tr>
          <td width="133"><img src="../imgs/logo170x62.jpg" width="170" height="62" alt="logo" /></td>
          <td colspan="2" align="center" class="titulo">Requisición <span style="color: #FF0000">$LAnulado$</span></td>
          <td width="1" align="right" nowrap="nowrap" class="numero">$TNumero$</td>
        </tr>
        <tr>
          <td colspan="4"><hr /></td>
        </tr>
        <tr>
          <td>Fecha</td>
          <td><strong>$TFecha$</strong></td>
          <td>Entrega</td>
          <td><strong>$TEntrega$</strong></td>
        </tr>
        <tr>
          <td>Paciente</td>
          <td colspan="3"><strong>$TPaciente$</strong></td>
        </tr>
        <tr>
            <td>Dirección</td>
            <td><b>$szDireccion$</b></td>
            <td>Barrio</td>
            <td nowrap="nowrap"><b>$szBarrio$</b></td>
        </tr>
        <tr>
            <td>Asegurador</td>
            <td><b>$szAsegurador$</b></td>
            <td>Teléfono</td>
            <td><b>$szTelefono$</b></td>
        </tr>
        <tr>
          <td colspan="4"><hr/></td>
        </tr>
        <tr>
            <td colspan="4" id="dp">
            	$GProductos$
            </td>
        </tr>
        <tr>
            <td colspan="4"><hr/></td>
        </tr>     
        <tr>
            <td>Observaciones</td>
            <td colspan="3"><strong>$TObservaciones$</strong></td>
        </tr>
        <tr>
        	<td colspan="4">
            	<table width="100%">
                	<tr>
                    	<td width="50%">&nbsp;</td>
                        <td><br/><br/><br/><hr/>Firma quien recibe<br />
Nombre<br />
Documento</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
    </td>
</tr>
</table>
</td>
</tr>
</table>
